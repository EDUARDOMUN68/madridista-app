<script>
let APP=null,currentFilter='all',resultFilter='LaLiga',standingFilter='LaLiga';
async function loadData(force=false){
  const btn=document.getElementById('refreshBtn');
  if(force&&btn)btn.classList.add('loading');
  try{
    const r=await fetch('real_madrid.json?ts='+Date.now(),{
      cache:'no-store',
      headers:{'Cache-Control':'no-cache'}
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    APP=await r.json();
    renderAll();
    if(force)showRefreshMessage('✓ Datos recargados');
    return true;
  }catch(e){
    APP=JSON.parse(document.getElementById('fallback-data').textContent);
    renderAll();
    if(force)showRefreshMessage('Mostrando los últimos datos guardados');
    return false;
  }finally{
    if(force&&btn)btn.classList.remove('loading');
  }
}
function showRefreshMessage(text){
  const el=document.getElementById('refreshMsg');
  if(!el)return;
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(window.__refreshTimer);
  window.__refreshTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
const venueIcon=v=>v==='home'?'🏠':'✈️'; const plus=n=>n>0?'+'+n:String(n); const rmRow=()=>APP.laligaStandings.find(x=>x.team==='Real Madrid')||{};
function liveLabel(x){return x.liveLabel||'En juego'}
function matchRight(x){
  if(x.status==='finished')return `<div class="score">${x.score||'–'}</div><div class="pending">Finalizado</div>`;
  if(x.status==='live')return `<div class="score">${x.score||'0–0'}</div><div class="live-state"><i class="live-dot"></i>${liveLabel(x)}</div>`;
  return `<div class="${x.time?'time':'pending'}">${x.time||'Por confirmar'}</div><div class="tv">${x.tv?.length?'📺 '+x.tv.join(' · '):''}</div>`;
}
function renderAll(){
  document.getElementById('season').textContent=APP.app.season;
  const d=new Date(APP.app.lastUpdated);
  document.getElementById('updated').innerHTML='Actualizado<br><b>'+d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'</b>';
  const n=APP.nextMatch;
  document.getElementById('nextTitle').textContent=n?.status==='live'?'Partido en juego':'Próximo partido';
  document.getElementById('nextMatch').textContent=venueIcon(n.venue)+' '+(n.venue==='home'?'Real Madrid – '+n.opponent:n.opponent+' – Real Madrid');
  document.getElementById('nextMeta').innerHTML=n.status==='live'
    ? `<span class="chip">${n.competition}</span><span class="chip">📅 ${n.displayDate}</span><span class="chip">⚽ ${n.score||'0–0'}</span><span class="chip">🔴 ${liveLabel(n)}</span>`
    : `<span class="chip">${n.competition}</span><span class="chip">📅 ${n.displayDate}</span><span class="chip">🕘 ${n.time||'Por confirmar'}</span>`;
  document.getElementById('nextTv').textContent='📺 '+(n.tv?.length?n.tv.join(' · '):'TV por confirmar');
  const rm=rmRow();
  document.getElementById('pos').textContent=rm.pos?rm.pos+'.º':'–';
  document.getElementById('pts').textContent=rm.pts??'–';
  document.getElementById('balance').textContent=rm.pj!=null?`${rm.g}–${rm.e}–${rm.p}`:'–';
  renderFixtures();renderResults();renderStandings();
}
function labelComp(x){return x.competition==='Champions'?'Champions':'Liga'}
function renderFixtures(){
  const list=APP.fixtures.filter(x=>currentFilter==='all'||x.competition===currentFilter);
  document.getElementById('fixtureCount').textContent=`${list.length} partidos`;
  document.getElementById('fixtures').innerHTML=list.map(x=>`<div class="fixture ${x.competition==='Champions'?'champ':''} ${x.status||''}"><div><div class="date">${x.displayDate}</div><div class="jornada">${x.jornada?`J${x.jornada}`:''}</div></div><div class="compcol"><div class="comp">${labelComp(x)}</div></div><div class="opponent"><span class="venue">${venueIcon(x.venue)}</span>${x.opponent}</div><div class="right">${matchRight(x)}</div></div>`).join('');
}
function renderResults(){
  const list=APP.fixtures.filter(x=>x.competition===resultFilter);
  document.getElementById('rmResults').innerHTML=list.map(x=>`<div class="result-row ${x.status||''}"><div><div class="date">${x.displayDate}</div><div class="jornada">${x.jornada?`J${x.jornada}`:''}</div></div><div class="compcol"><div class="comp">${labelComp(x)}</div></div><div class="opponent"><span class="venue">${venueIcon(x.venue)}</span>${x.opponent}</div><div class="result-score">${x.status==='finished'?x.score:x.status==='live'?`${x.score||'0–0'}<div class="live-state"><i class="live-dot"></i>${liveLabel(x)}</div>`:(x.time||'Pendiente')}</div></div>`).join('');
}
function zoneFor(pos,competition){
  const zones=APP.qualificationZones?.[competition]||[];
  const z=zones.find(z=>pos>=z.from&&pos<=z.to);
  return z?z.key:'';
}
function legendHtml(competition){
  if(competition==='LaLiga'){
    return `<div class="zone-legend">
      <span class="zone-item"><i class="zone-dot dot-ucl"></i>Champions</span>
      <span class="zone-item"><i class="zone-dot dot-uel"></i>Europa League</span>
      <span class="zone-item"><i class="zone-dot dot-uecl"></i>Conference League</span>
      <span class="zone-item"><i class="zone-dot dot-drop"></i>Descenso</span>
    </div>
    <div class="zone-note">Las plazas europeas mostradas son la distribución liguera base y pueden desplazarse por la Copa del Rey o por cupos UEFA adicionales.</div>`;
  }
  return `<div class="zone-legend">
    <span class="zone-item"><i class="zone-dot dot-direct"></i>1.º–8.º · Octavos directos</span>
    <span class="zone-item"><i class="zone-dot dot-playoff"></i>9.º–24.º · Playoff</span>
    <span class="zone-item"><i class="zone-dot dot-elim"></i>25.º–36.º · Eliminados</span>
  </div>`;
}
function standingsBanner(competition){
  const meta=APP.standingsMeta?.[competition];
  if(!meta||meta.mode!=='provisional')return '';
  const live=meta.liveGames||0,pending=meta.pendingOfficialGames||0;
  const detail=live?`${live} partido${live===1?'':'s'} en juego`:`${pending} resultado${pending===1?'':'s'} pendiente${pending===1?'':'s'} de reflejarse oficialmente`;
  return `<div class="provisional-banner"><i class="live-dot"></i><div><b>Clasificación provisional</b>${detail}. Los equipos afectados aparecen marcados.</div></div>`;
}
function tableHtml(rows,competition){
  const banner=standingsBanner(competition);
  const note=(APP.standingsMeta?.[competition]?.mode==='provisional')?`<div class="provisional-note">* La tabla se recalcula con los marcadores actuales. En caso de empate, el orden puede variar cuando se apliquen todos los criterios oficiales de desempate.</div>`:'';
  return `${banner}${legendHtml(competition)}<div class="card table-wrap standings-card"><table class="standings"><colgroup><col class="pos"><col class="team">${'<col class="num">'.repeat(8)}</colgroup><thead><tr><th>Pos</th><th class="teamh">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>${rows.map(x=>{const z=zoneFor(x.pos,competition);const badge=x.provisional?`<span class="prov-badge ${x.live?'':'pending-official'}">${x.live?'● '+(x.liveLabel||'EN JUEGO'):'PROV.'}</span>`:'';return `<tr class="${x.team==='Real Madrid'?'rm ':''}${z?'zone-'+z+' ':''}${x.provisional?'provisional-row':''}"><td>${x.pos}</td><td class="team">${x.team==='Real Madrid'?'👑 ':''}${x.team}${badge}</td><td>${x.pts}</td><td>${x.pj}</td><td>${x.g}</td><td>${x.e}</td><td>${x.p}</td><td>${x.gf}</td><td>${x.gc}</td><td>${plus(x.dg)}</td></tr>`}).join('')}</tbody></table></div>${note}`;
}
function renderStandings(){
  const a=document.getElementById('standingArea');
  if(standingFilter==='LaLiga'){
    a.innerHTML=tableHtml(APP.laligaStandings,'LaLiga');
    return;
  }
  if(APP.championsStandings?.length){
    a.innerHTML=tableHtml(APP.championsStandings,'Champions');
  }else{
    a.innerHTML=`${legendHtml('Champions')}<div class="card empty"><div class="icon">⭐</div><h3>La Champions todavía no ha empezado</h3><p>La fase liga comienza el 8 de septiembre. En cuanto se disputen los primeros partidos, aquí aparecerá la clasificación completa de los 36 equipos, con el Real Madrid destacado y las zonas de clasificación coloreadas.</p></div>`;
  }
}
function activateFilter(container,btn){container.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activateFilter(document.getElementById('calendarFilters'),b);currentFilter=b.dataset.filter;renderFixtures()});document.querySelectorAll('[data-rfilter]').forEach(b=>b.onclick=()=>{activateFilter(document.getElementById('resultFilters'),b);resultFilter=b.dataset.rfilter;renderResults()});document.querySelectorAll('[data-sfilter]').forEach(b=>b.onclick=()=>{activateFilter(document.getElementById('standingFilters'),b);standingFilter=b.dataset.sfilter;renderStandings()});document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});document.getElementById('refreshBtn')?.addEventListener('click',()=>loadData(true));loadData();
</script>
