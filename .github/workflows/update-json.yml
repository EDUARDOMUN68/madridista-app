name: Actualizar datos Madridista

on:
  schedule:
    # Una sola rutina cada 5 minutos, desplazada de los minutos redondos.
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madridista-json-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seguimiento en directo
        run: python update_data.py --live-only

      - name: Revisión completa periódica
        shell: bash
        run: |
          MIN=$(date -u +%M)
          MIN=$((10#$MIN))

          if [ "$MIN" -ge 15 ] && [ "$MIN" -le 24 ]; then
            echo "Toca revisión completa."
            python update_data.py
          else
            echo "No toca revisión completa."
          fi

      - name: Guardar cambios si los hay
        shell: bash
        run: |
          if git diff --quiet -- real_madrid.json; then
            echo "No hay cambios."
            exit 0
          fi

          git config user.name "Madridista Bot"
          git config user.email "actions@users.noreply.github.com"
          git add real_madrid.json
          git commit -m "Actualiza directo y clasificaciones"
          git push
