name: Actualizar datos Madridista

on:
  # Una vez cada hora. Si no hay cambios, no hace ningún commit.
  schedule:
    - cron: "17 * * * *"

  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madridista-json-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar JSON
        run: python update_data.py

      - name: Guardar cambios si los hay
        shell: bash
        run: |
          if git diff --quiet -- real_madrid.json; then
            echo "No hay cambios."
            exit 0
          fi

          git config user.name "Madridista Bot"
          git config user.email "actions@users.noreply.github.com"
          git add real_madrid.json
          git commit -m "Actualiza calendario, resultados y clasificaciones"
          git push
