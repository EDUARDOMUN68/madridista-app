name: Actualizar datos Madridista

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madridista-json-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisión completa
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
        run: python update_data.py

      - name: Seguimiento en directo
        if: github.event.schedule == '*/5 * * * *'
        run: python update_data.py --live-only

      - name: Guardar cambios si los hay
        shell: bash
        run: |
          if git diff --quiet -- real_madrid.json; then
            echo "No hay cambios."
            exit 0
          fi

          git config user.name "Madridista Bot"
          git config user.email "actions@users.noreply.github.com"
          git add real_madrid.json
          git commit -m "Actualiza directo y clasificaciones"
          git push
